<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#5b1ea8"/>
      <stop offset="60%" stop-color="#3a1273"/>
      <stop offset="100%" stop-color="#2a0d5c"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe14d" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffb000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6ffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066aa"/>
    </radialGradient>
    <linearGradient id="robotBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0ea"/>
      <stop offset="100%" stop-color="#c9c0b4"/>
    </linearGradient>
    <linearGradient id="robotHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8cfc1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Diagonal stripe accents -->
  <g opacity="0.07" fill="#ffe14d">
    <rect x="-100" y="-50" width="60" height="1000" transform="rotate(20 0 0)"/>
    <rect x="100" y="-50" width="40" height="1000" transform="rotate(20 0 0)"/>
    <rect x="300" y="-50" width="80" height="1000" transform="rotate(20 0 0)"/>
    <rect x="600" y="-50" width="50" height="1000" transform="rotate(20 0 0)"/>
    <rect x="900" y="-50" width="70" height="1000" transform="rotate(20 0 0)"/>
  </g>

  <!-- Glowing burst behind robot -->
  <circle cx="980" cy="360" r="340" fill="url(#burst)"/>

  <!-- Orange pill -->
  <rect x="60" y="60" width="260" height="48" rx="24" fill="#ff6a00"/>
  <text x="190" y="94" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="2">CLAUDE CODE</text>

  <!-- Title line 1 -->
  <text x="60" y="200" font-family="Impact, Arial Black, sans-serif" font-size="76" fill="#ffffff" letter-spacing="1">CUSTOM SKILL</text>

  <!-- Highlight rect covering last 2 lines (single rect, skewed) -->
  <g transform="translate(40,230)">
    <rect x="0" y="0" width="820" height="260" fill="#ffe14d" transform="skewX(-10)"/>
  </g>
  <!-- Text on top, no transform -->
  <text x="70" y="330" font-family="Impact, Arial Black, sans-serif" font-size="108" fill="#2a0d5c" letter-spacing="1">AGENTCORE</text>
  <text x="70" y="448" font-family="Impact, Arial Black, sans-serif" font-size="92" fill="#2a0d5c" letter-spacing="1">SECURE GATEWAY</text>

  <!-- Terminal / code lines bottom-left -->
  <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#b9a3e8" opacity="0.85">
    <text x="60" y="540">$ claude code --skill agentcore</text>
    <text x="60" y="562">&gt; gateway.connect(secure=True)</text>
    <text x="60" y="584">&gt; auth.verify() ... OK</text>
    <text x="60" y="606">&gt; tunnel established [200]</text>
  </g>

  <!-- ROBOT -->
  <g transform="translate(900,180)">
    <!-- Antenna -->
    <line x1="100" y1="-20" x2="100" y2="20" stroke="#d8cfc1" stroke-width="5"/>
    <circle cx="100" cy="-28" r="10" fill="#ffe14d"/>
    <circle cx="100" cy="-28" r="4" fill="#fff7c2"/>

    <!-- Ear panels -->
    <rect x="-8" y="70" width="18" height="60" rx="6" fill="#a89c8a"/>
    <rect x="190" y="70" width="18" height="60" rx="6" fill="#a89c8a"/>

    <!-- Head -->
    <rect x="10" y="20" width="180" height="160" rx="26" fill="url(#robotHead)" stroke="#2a0d5c" stroke-width="3"/>

    <!-- Eye sockets -->
    <rect x="40" y="70" width="48" height="36" rx="8" fill="#1a0640"/>
    <rect x="112" y="70" width="48" height="36" rx="8" fill="#1a0640"/>
    <!-- Glowing eyes -->
    <rect x="44" y="74" width="40" height="28" rx="6" fill="url(#eye)"/>
    <rect x="116" y="74" width="40" height="28" rx="6" fill="url(#eye)"/>

    <!-- Mouth grille -->
    <g stroke="#2a0d5c" stroke-width="3" stroke-linecap="round">
      <line x1="65" y1="140" x2="80" y2="140"/>
      <line x1="90" y1="140" x2="105" y2="140"/>
      <line x1="115" y1="140" x2="130" y2="140"/>
      <line x1="140" y1="140" x2="155" y2="140"/>
    </g>

    <!-- Neck -->
    <rect x="80" y="180" width="40" height="18" fill="#a89c8a"/>

    <!-- Body -->
    <rect x="-10" y="198" width="220" height="180" rx="20" fill="url(#robotBody)" stroke="#2a0d5c" stroke-width="3"/>

    <!-- Chest screen -->
    <rect x="20" y="220" width="120" height="80" rx="6" fill="#1a0640"/>
    <g font-family="Consolas, monospace" font-size="10" fill="#7CFC9F">
      <text x="28" y="238">&gt; init()</text>
      <text x="28" y="254">&gt; auth.ok</text>
      <text x="28" y="270">&gt; gateway</text>
      <text x="28" y="286">&gt; secure_</text>
    </g>
    <!-- blinking cursor -->
    <rect x="78" y="278" width="8" height="12" fill="#7CFC9F"/>

    <!-- AI badge -->
    <circle cx="170" cy="260" r="28" fill="#ff6a00" stroke="#ffffff" stroke-width="3"/>
    <text x="170" y="270" font-family="Arial Black, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="900">AI</text>

    <!-- Arms -->
    <rect x="-50" y="210" width="40" height="120" rx="18" fill="#c9c0b4" stroke="#2a0d5c" stroke-width="3"/>
    <circle cx="-30" cy="340" r="22" fill="#d8cfc1" stroke="#2a0d5c" stroke-width="3"/>
    <rect x="210" y="210" width="40" height="120" rx="18" fill="#c9c0b4" stroke="#2a0d5c" stroke-width="3"/>
    <circle cx="230" cy="340" r="22" fill="#d8cfc1" stroke="#2a0d5c" stroke-width="3"/>

    <!-- Legs -->
    <rect x="40" y="378" width="40" height="70" rx="10" fill="#a89c8a" stroke="#2a0d5c" stroke-width="3"/>
    <rect x="120" y="378" width="40" height="70" rx="10" fill="#a89c8a" stroke="#2a0d5c" stroke-width="3"/>
    <!-- Feet -->
    <rect x="28" y="445" width="60" height="18" rx="6" fill="#2a0d5c"/>
    <rect x="112" y="445" width="60" height="18" rx="6" fill="#2a0d5c"/>
  </g>

  <!-- Footer -->
  <rect x="0" y="672" width="1280" height="48" fill="#1a0640"/>
  <text x="24" y="704" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#ffe14d">HOMETASK AI</text>
  <text x="540" y="704" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">https://hometask.io</text>
  <text x="1256" y="704" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="end">sales@hometask.io</text>
</svg>