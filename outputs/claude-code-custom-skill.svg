<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#3a1273"/>
<stop offset="0.55" stop-color="#5b1ea8"/>
<stop offset="1" stop-color="#2a0d5c"/>
</linearGradient>
<radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffe14d" stop-opacity="0.55"/>
<stop offset="0.5" stop-color="#ffb000" stop-opacity="0.18"/>
<stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
</radialGradient>
<radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="0.4" stop-color="#7df9ff"/>
<stop offset="1" stop-color="#00b3c7"/>
</radialGradient>
</defs>

<!-- Background -->
<rect width="1280" height="720" fill="url(#bg)"/>

<!-- Diagonal stripe accents -->
<g opacity="0.07" fill="#ffe14d">
<rect x="-100" y="-50" width="60" height="1100" transform="rotate(20 0 0)"/>
<rect x="200" y="-50" width="40" height="1100" transform="rotate(20 0 0)"/>
<rect x="450" y="-50" width="80" height="1100" transform="rotate(20 0 0)"/>
<rect x="800" y="-50" width="50" height="1100" transform="rotate(20 0 0)"/>
</g>

<!-- Glowing burst behind robot -->
<circle cx="970" cy="360" r="340" fill="url(#burst)"/>

<!-- Orange tag top-left -->
<rect x="60" y="60" width="260" height="46" rx="6" fill="#ff6a00"/>
<text x="190" y="92" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="2">CLAUDE CODE</text>

<!-- Title -->
<text x="60" y="210" font-family="Impact, Arial Black, sans-serif" font-size="92" fill="#ffffff" letter-spacing="1">Claude Code:</text>

<!-- Yellow skewed highlight behind last two lines -->
<g transform="skewX(-10)">
<rect x="20" y="240" width="780" height="240" fill="#ffe14d"/>
</g>

<!-- Highlighted text on top, no transform -->
<text x="60" y="345" font-family="Impact, Arial Black, sans-serif" font-size="116" fill="#2a0d5c" letter-spacing="1">CUSTOM</text>
<text x="60" y="460" font-family="Impact, Arial Black, sans-serif" font-size="116" fill="#2a0d5c" letter-spacing="1">SKILL</text>

<!-- Terminal lines bottom-left -->
<g font-family="Consolas, Menlo, monospace" font-size="16" fill="#c9b8ff" opacity="0.85">
<text x="60" y="540">$ claude skill create --name custom</text>
<text x="60" y="562">&gt; loading sdk... ok</text>
<text x="60" y="584">&gt; building handler... ok</text>
<text x="60" y="606">&gt; skill ready_</text>
</g>

<!-- ROBOT -->
<g transform="translate(820,180)">
<!-- Antenna -->
<line x1="155" y1="20" x2="155" y2="-15" stroke="#ffe14d" stroke-width="5"/>
<circle cx="155" cy="-22" r="10" fill="#ffe14d"/>
<circle cx="155" cy="-22" r="4" fill="#fff"/>

<!-- Head -->
<rect x="55" y="20" width="200" height="160" rx="28" fill="#e8e3f5" stroke="#2a0d5c" stroke-width="4"/>
<!-- Ear panels -->
<rect x="40" y="70" width="20" height="60" rx="6" fill="#b8aede" stroke="#2a0d5c" stroke-width="3"/>
<rect x="250" y="70" width="20" height="60" rx="6" fill="#b8aede" stroke="#2a0d5c" stroke-width="3"/>

<!-- Eyes glow -->
<rect x="85" y="70" width="55" height="40" rx="8" fill="#0a1a2a"/>
<rect x="170" y="70" width="55" height="40" rx="8" fill="#0a1a2a"/>
<ellipse cx="112" cy="90" rx="22" ry="15" fill="url(#eye)"/>
<ellipse cx="197" cy="90" rx="22" ry="15" fill="url(#eye)"/>

<!-- Mouth grille -->
<g stroke="#2a0d5c" stroke-width="4" stroke-linecap="round">
<line x1="110" y1="145" x2="125" y2="145"/>
<line x1="135" y1="145" x2="150" y2="145"/>
<line x1="160" y1="145" x2="175" y2="145"/>
<line x1="185" y1="145" x2="200" y2="145"/>
</g>

<!-- Neck -->
<rect x="135" y="180" width="40" height="20" fill="#b8aede" stroke="#2a0d5c" stroke-width="3"/>

<!-- Body -->
<rect x="50" y="200" width="210" height="170" rx="22" fill="#d4cce8" stroke="#2a0d5c" stroke-width="4"/>

<!-- Chest screen -->
<rect x="75" y="220" width="160" height="80" rx="6" fill="#0a1a2a"/>
<g font-family="Consolas, monospace" font-size="11" fill="#7df9ff">
<text x="83" y="238">&gt; skill.run()</text>
<text x="83" y="254">  loading...</text>
<text x="83" y="270">  status: ok</text>
<text x="83" y="286">  ready_</text>
</g>

<!-- AI badge -->
<circle cx="155" cy="335" r="22" fill="#ff6a00" stroke="#2a0d5c" stroke-width="3"/>
<text x="155" y="343" font-family="Arial Black, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">AI</text>

<!-- Arms -->
<rect x="15" y="215" width="35" height="110" rx="16" fill="#b8aede" stroke="#2a0d5c" stroke-width="3"/>
<circle cx="32" cy="335" r="20" fill="#d4cce8" stroke="#2a0d5c" stroke-width="3"/>
<rect x="260" y="215" width="35" height="110" rx="16" fill="#b8aede" stroke="#2a0d5c" stroke-width="3"/>
<circle cx="278" cy="335" r="20" fill="#d4cce8" stroke="#2a0d5c" stroke-width="3"/>

<!-- Legs -->
<rect x="90" y="370" width="40" height="65" rx="10" fill="#b8aede" stroke="#2a0d5c" stroke-width="3"/>
<rect x="180" y="370" width="40" height="65" rx="10" fill="#b8aede" stroke="#2a0d5c" stroke-width="3"/>
<!-- Feet -->
<rect x="78" y="430" width="60" height="18" rx="6" fill="#2a0d5c"/>
<rect x="172" y="430" width="60" height="18" rx="6" fill="#2a0d5c"/>
</g>

<!-- Footer -->
<rect x="0" y="672" width="1280" height="48" fill="#1a0640"/>
<text x="24" y="704" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#ffe14d">HOMETASK AI</text>
<text x="500" y="703" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff">https://hometask.io</text>
<text x="1256" y="703" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="end">sales@hometask.io</text>
</svg>