<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1273"/>
      <stop offset="55%" stop-color="#5b1ea8"/>
      <stop offset="100%" stop-color="#2a0d5c"/>
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe14d" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffe14d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffe14d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#bff7ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077aa"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6fb"/>
      <stop offset="100%" stop-color="#b9c1d6"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c2cae0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Diagonal stripes -->
  <g opacity="0.07" fill="#ffe14d">
    <rect x="-200" y="-50" width="80" height="1100" transform="rotate(20 640 360)"/>
    <rect x="50" y="-50" width="60" height="1100" transform="rotate(20 640 360)"/>
    <rect x="300" y="-50" width="40" height="1100" transform="rotate(20 640 360)"/>
    <rect x="900" y="-50" width="80" height="1100" transform="rotate(20 640 360)"/>
    <rect x="1150" y="-50" width="50" height="1100" transform="rotate(20 640 360)"/>
  </g>

  <!-- Radial burst behind robot -->
  <circle cx="980" cy="360" r="340" fill="url(#burst)"/>

  <!-- Top-left tag -->
  <g>
    <rect x="60" y="60" width="260" height="46" rx="23" fill="#ff6a00"/>
    <text x="190" y="92" font-family="Impact, Arial Black, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">CLAUDE CODE</text>
  </g>

  <!-- Title text -->
  <text x="60" y="200" font-family="Impact, Arial Black, sans-serif" font-size="78" fill="#ffffff" letter-spacing="1">CUSTOM SKILL</text>

  <!-- Highlighted lines: single skewed rect -->
  <g transform="translate(60 240)">
    <rect x="-12" y="0" width="720" height="220" fill="#ffe14d" transform="skewX(-10)"/>
  </g>
  <text x="70" y="330" font-family="Impact, Arial Black, sans-serif" font-size="96" fill="#2a0d5c" letter-spacing="1">ADDING</text>
  <text x="70" y="430" font-family="Impact, Arial Black, sans-serif" font-size="96" fill="#2a0d5c" letter-spacing="1">GITHUB</text>

  <!-- Subtitle / tutorial line -->
  <text x="60" y="490" font-family="Impact, Arial Black, sans-serif" font-size="38" fill="#ffe14d" letter-spacing="2">STEP-BY-STEP TUTORIAL</text>

  <!-- Terminal decoration bottom-left -->
  <g font-family="Consolas, Monaco, monospace" font-size="16" fill="#b9a6e8" opacity="0.85">
    <text x="60" y="555">$ claude --skill add github</text>
    <text x="60" y="578">  &gt; connecting to repo...</text>
    <text x="60" y="601">  &gt; auth: ok  skill: ready</text>
    <text x="60" y="624">$ _</text>
  </g>

  <!-- ROBOT -->
  <g transform="translate(820 175)">
    <!-- Antenna -->
    <line x1="160" y1="-30" x2="160" y2="10" stroke="#cfd6e8" stroke-width="6"/>
    <circle cx="160" cy="-38" r="12" fill="#ff6a00"/>
    <circle cx="160" cy="-38" r="5" fill="#ffd9b3"/>

    <!-- Head -->
    <rect x="60" y="10" width="200" height="160" rx="28" fill="url(#headGrad)" stroke="#3a1273" stroke-width="4"/>
    <!-- Ear panels -->
    <rect x="40" y="60" width="22" height="70" rx="8" fill="#8a93ad" stroke="#3a1273" stroke-width="3"/>
    <rect x="258" y="60" width="22" height="70" rx="8" fill="#8a93ad" stroke="#3a1273" stroke-width="3"/>

    <!-- Eye sockets -->
    <rect x="88" y="55" width="64" height="48" rx="10" fill="#0a0a1a"/>
    <rect x="168" y="55" width="64" height="48" rx="10" fill="#0a0a1a"/>
    <!-- Glowing eyes -->
    <ellipse cx="120" cy="79" rx="24" ry="18" fill="url(#eyeGlow)"/>
    <ellipse cx="200" cy="79" rx="24" ry="18" fill="url(#eyeGlow)"/>
    <circle cx="128" cy="73" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="208" cy="73" r="5" fill="#ffffff" opacity="0.9"/>

    <!-- Mouth grille -->
    <g stroke="#3a1273" stroke-width="4" stroke-linecap="round">
      <line x1="115" y1="138" x2="135" y2="138"/>
      <line x1="145" y1="138" x2="165" y2="138"/>
      <line x1="175" y1="138" x2="195" y2="138"/>
      <line x1="205" y1="138" x2="225" y2="138"/>
    </g>

    <!-- Neck -->
    <rect x="135" y="170" width="50" height="20" fill="#8a93ad"/>

    <!-- Body -->
    <rect x="40" y="190" width="240" height="170" rx="22" fill="url(#bodyGrad)" stroke="#3a1273" stroke-width="4"/>

    <!-- Chest screen -->
    <rect x="70" y="210" width="130" height="80" rx="8" fill="#0e0a2a" stroke="#3a1273" stroke-width="2"/>
    <g font-family="Consolas, Monaco, monospace" font-size="10" fill="#7cf6c6">
      <text x="78" y="226">&gt; git init</text>
      <text x="78" y="242">&gt; commit -m</text>
      <text x="78" y="258">&gt; push origin</text>
      <text x="78" y="274">&gt; ok ✦</text>
    </g>

    <!-- AI badge -->
    <circle cx="235" cy="250" r="28" fill="#ff6a00" stroke="#ffffff" stroke-width="3"/>
    <text x="235" y="259" font-family="Arial Black, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="900">AI</text>

    <!-- Arms -->
    <rect x="0" y="205" width="42" height="120" rx="20" fill="#8a93ad" stroke="#3a1273" stroke-width="4"/>
    <circle cx="21" cy="335" r="24" fill="#cfd6e8" stroke="#3a1273" stroke-width="4"/>
    <rect x="278" y="205" width="42" height="120" rx="20" fill="#8a93ad" stroke="#3a1273" stroke-width="4"/>
    <circle cx="299" cy="335" r="24" fill="#cfd6e8" stroke="#3a1273" stroke-width="4"/>

    <!-- Legs -->
    <rect x="90" y="360" width="44" height="60" rx="10" fill="#8a93ad" stroke="#3a1273" stroke-width="4"/>
    <rect x="186" y="360" width="44" height="60" rx="10" fill="#8a93ad" stroke="#3a1273" stroke-width="4"/>
    <rect x="78" y="415" width="68" height="20" rx="8" fill="#3a1273"/>
    <rect x="174" y="415" width="68" height="20" rx="8" fill="#3a1273"/>
  </g>

  <!-- Footer -->
  <rect x="0" y="672" width="1280" height="48" fill="#1a0640"/>
  <text x="24" y="704" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#ffe14d">HOMETASK AI</text>
  <text x="560" y="703" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">https://hometask.io</text>
  <text x="1256" y="703" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="end">sales@hometask.io</text>
</svg>