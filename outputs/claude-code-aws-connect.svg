<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1273"/>
      <stop offset="0.5" stop-color="#5b1ea8"/>
      <stop offset="1" stop-color="#2a0d5c"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#00aac4"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f1e8"/>
      <stop offset="1" stop-color="#c9c2b1"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6cfbf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Diagonal accent stripes -->
  <polygon points="0,560 420,180 520,180 100,560" fill="#ffe14d" opacity="0.08"/>
  <polygon points="0,640 380,260 480,260 100,640" fill="#ffe14d" opacity="0.06"/>

  <!-- Yellow burst behind robot -->
  <circle cx="990" cy="370" r="280" fill="#ffd633" opacity="0.18"/>
  <circle cx="990" cy="370" r="200" fill="#ffd633" opacity="0.15"/>

  <!-- Top tag -->
  <rect x="60" y="60" width="230" height="46" rx="6" fill="#ff6a00"/>
  <text x="175" y="93" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">CLAUDE CODE</text>

  <!-- Main Title -->
  <text x="60" y="195" font-family="Impact, Arial Black, sans-serif" font-size="92" fill="#ffe14d" letter-spacing="-1">CUSTOM SKILL</text>
  
  <text x="60" y="305" font-family="Impact, Arial Black, sans-serif" font-size="76" fill="#ffffff" letter-spacing="-1">CREATE AN</text>
  <text x="60" y="385" font-family="Impact, Arial Black, sans-serif" font-size="76" fill="#ffffff" letter-spacing="-1">AWS CONNECT</text>
  
  <!-- INSTANCE highlight -->
  <rect x="56" y="410" width="430" height="80" fill="#ffe14d" transform="skewX(-8)"/>
  <text x="70" y="473" font-family="Impact, Arial Black, sans-serif" font-size="72" fill="#3a1273" letter-spacing="-1">INSTANCE</text>

  <!-- Bottom code lines decoration -->
  <g opacity="0.7" font-family="Consolas, monospace" font-size="16" fill="#b39ddb">
    <text x="60" y="555">$ claude --skill aws-connect</text>
    <text x="60" y="580">&gt; provisioning instance...</text>
    <text x="60" y="605">&gt; ready in 60s</text>
  </g>

  <!-- Robot -->
  <g transform="translate(870,180)">
    <!-- Antenna -->
    <line x1="120" y1="-30" x2="120" y2="10" stroke="#ffe14d" stroke-width="5"/>
    <circle cx="120" cy="-38" r="12" fill="#ffe14d"/>
    <circle cx="120" cy="-38" r="5" fill="#ffffff"/>

    <!-- Ear panels -->
    <rect x="-10" y="60" width="22" height="60" rx="6" fill="#8a7ea0"/>
    <rect x="228" y="60" width="22" height="60" rx="6" fill="#8a7ea0"/>

    <!-- Head -->
    <rect x="10" y="10" width="220" height="170" rx="32" fill="url(#headGrad)" stroke="#3a1273" stroke-width="4"/>
    
    <!-- Eye glow -->
    <rect x="40" y="60" width="65" height="55" rx="10" fill="#0a0a1a"/>
    <rect x="135" y="60" width="65" height="55" rx="10" fill="#0a0a1a"/>
    <ellipse cx="72" cy="87" rx="22" ry="18" fill="url(#eye)"/>
    <ellipse cx="167" cy="87" rx="22" ry="18" fill="url(#eye)"/>
    <circle cx="78" cy="82" r="5" fill="#ffffff"/>
    <circle cx="173" cy="82" r="5" fill="#ffffff"/>

    <!-- Mouth grille -->
    <line x1="80" y1="145" x2="95" y2="145" stroke="#3a1273" stroke-width="4" stroke-linecap="round"/>
    <line x1="105" y1="145" x2="135" y2="145" stroke="#3a1273" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="145" x2="160" y2="145" stroke="#3a1273" stroke-width="4" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="95" y="180" width="50" height="20" fill="#8a7ea0"/>

    <!-- Body -->
    <rect x="-10" y="200" width="260" height="200" rx="24" fill="url(#bodyGrad)" stroke="#3a1273" stroke-width="4"/>

    <!-- Chest screen -->
    <rect x="20" y="220" width="135" height="95" rx="8" fill="#1a0a3a"/>
    <line x1="32" y1="240" x2="100" y2="240" stroke="#7df9ff" stroke-width="3"/>
    <line x1="32" y1="255" x2="130" y2="255" stroke="#ffe14d" stroke-width="3"/>
    <line x1="32" y1="270" x2="80" y2="270" stroke="#ff6a00" stroke-width="3"/>
    <line x1="32" y1="285" x2="115" y2="285" stroke="#7df9ff" stroke-width="3"/>
    <line x1="32" y1="300" x2="95" y2="300" stroke="#ffe14d" stroke-width="3"/>

    <!-- AI Badge -->
    <circle cx="195" cy="355" r="32" fill="#ff6a00" stroke="#ffffff" stroke-width="3"/>
    <text x="195" y="365" font-family="Arial Black, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="900">AI</text>

    <!-- Arms -->
    <rect x="-55" y="220" width="40" height="120" rx="18" fill="#8a7ea0" stroke="#3a1273" stroke-width="3"/>
    <circle cx="-35" cy="350" r="22" fill="url(#bodyGrad)" stroke="#3a1273" stroke-width="3"/>
    <rect x="255" y="220" width="40" height="120" rx="18" fill="#8a7ea0" stroke="#3a1273" stroke-width="3"/>
    <circle cx="275" cy="350" r="22" fill="url(#bodyGrad)" stroke="#3a1273" stroke-width="3"/>

    <!-- Legs -->
    <rect x="40" y="400" width="42" height="70" rx="10" fill="#8a7ea0" stroke="#3a1273" stroke-width="3"/>
    <rect x="158" y="400" width="42" height="70" rx="10" fill="#8a7ea0" stroke="#3a1273" stroke-width="3"/>
    <rect x="30" y="465" width="62" height="20" rx="8" fill="#3a1273"/>
    <rect x="148" y="465" width="62" height="20" rx="8" fill="#3a1273"/>
  </g>

  <!-- Footer / branding -->
  <rect x="0" y="685" width="1280" height="35" fill="#1a0a3a" opacity="0.85"/>
  <text x="20" y="709" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffe14d" font-weight="bold">Hometask AI</text>
  <text x="160" y="709" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#ffffff">hometask.io</text>
  <text x="1260" y="709" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="end">sales@hometask.io</text>
</svg>