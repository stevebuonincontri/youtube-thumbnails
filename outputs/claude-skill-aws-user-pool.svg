<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="0.5" stop-color="#2a1547"/>
      <stop offset="1" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b07cf7"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#ec7211"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9900" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b07cf7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b07cf7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  
  <!-- Ambient glows -->
  <circle cx="1050" cy="180" r="320" fill="url(#glow)"/>
  <circle cx="200" cy="600" r="350" fill="url(#glowP)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Top label -->
  <g transform="translate(60,70)">
    <circle cx="14" cy="14" r="10" fill="url(#purple)"/>
    <text x="36" y="22" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#cdb8ff" letter-spacing="3">CLAUDE CUSTOM SKILL</text>
  </g>

  <!-- Main title -->
  <g font-family="Impact, Arial Black, sans-serif" fill="#ffffff">
    <text x="60" y="230" font-size="108" font-weight="900" letter-spacing="-2">CREATE AN</text>
    <text x="60" y="350" font-size="128" font-weight="900" fill="url(#orange)" letter-spacing="-2" stroke="#1a1033" stroke-width="2">AWS COGNITO</text>
    <text x="60" y="470" font-size="128" font-weight="900" fill="url(#purple)" letter-spacing="-2" stroke="#1a1033" stroke-width="2">USER POOL</text>
  </g>

  <!-- Subtitle -->
  <text x="60" y="525" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#a89cc7" letter-spacing="1">with a custom Claude Skill — no console required</text>

  <!-- Bottom code block -->
  <g transform="translate(60,565)" filter="url(#shadow)">
    <rect width="760" height="120" rx="12" fill="#15102a" stroke="#3a2860" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="24" r="6" fill="#febc2e"/>
    <circle cx="68" cy="24" r="6" fill="#28c840"/>
    <text x="24" y="72" font-family="Menlo, Consolas, monospace" font-size="20" fill="#9d8ec9">$ claude skill run</text>
    <text x="24" y="100" font-family="Menlo, Consolas, monospace" font-size="20">
      <tspan fill="#ff9900">cognito-pool</tspan>
      <tspan fill="#9d8ec9"> --region </tspan>
      <tspan fill="#b07cf7">us-east-1</tspan>
      <tspan fill="#9d8ec9"> --mfa </tspan>
      <tspan fill="#7ee787">enabled</tspan>
    </text>
  </g>

  <!-- Right side: Cloud + Lock icon -->
  <g transform="translate(880,200)">
    <!-- Cloud -->
    <g filter="url(#shadow)">
      <path d="M 80 130 
               Q 30 130 30 90 
               Q 30 50 75 50
               Q 85 15 130 15
               Q 175 15 190 50
               Q 240 50 240 95
               Q 240 130 200 130 Z" 
            fill="url(#orange)"/>
    </g>
    
    <!-- Lock body -->
    <g transform="translate(95,140)">
      <rect x="0" y="55" width="120" height="100" rx="14" fill="url(#purple)" stroke="#ffffff" stroke-width="3"/>
      <path d="M 20 55 L 20 35 Q 20 0 60 0 Q 100 0 100 35 L 100 55" 
            stroke="#b07cf7" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="60" cy="100" r="10" fill="#1a1033"/>
      <rect x="56" y="100" width="8" height="26" fill="#1a1033"/>
    </g>

    <!-- Orbit dots -->
    <circle cx="40" cy="280" r="8" fill="#ff9900"/>
    <circle cx="270" cy="290" r="10" fill="#b07cf7"/>
    <circle cx="20" cy="40" r="6" fill="#b07cf7" opacity="0.7"/>
    <circle cx="280" cy="20" r="5" fill="#ff9900" opacity="0.7"/>
  </g>

  <!-- Bottom right accent -->
  <g transform="translate(880,605)">
    <rect width="340" height="70" rx="35" fill="#ff9900"/>
    <text x="170" y="46" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="800" fill="#1a1033" letter-spacing="1">STEP-BY-STEP DEMO</text>
  </g>
</svg>