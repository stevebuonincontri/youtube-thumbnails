<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="60%" stop-color="#0a0e1f"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB066"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B89AFF"/>
      <stop offset="100%" stop-color="#7B5CFF"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A8FF"/>
      <stop offset="100%" stop-color="#6B4DCC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B5CFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g stroke="#1f2847" stroke-width="1" opacity="0.5">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Glow areas -->
  <circle cx="950" cy="380" r="340" fill="url(#glowP)"/>
  <circle cx="240" cy="200" r="280" fill="url(#glow)"/>
  <circle cx="1120" cy="600" r="240" fill="url(#glow)"/>

  <!-- Multi-agent network nodes on right side -->
  <g stroke="#FF9900" stroke-width="2" opacity="0.55" fill="none">
    <line x1="950" y1="380" x2="1080" y2="220"/>
    <line x1="950" y1="380" x2="1160" y2="350"/>
    <line x1="950" y1="380" x2="1080" y2="540"/>
    <line x1="950" y1="380" x2="820" y2="240"/>
    <line x1="950" y1="380" x2="820" y2="540"/>
    <line x1="1080" y1="220" x2="1160" y2="350"/>
    <line x1="1160" y1="350" x2="1080" y2="540"/>
    <line x1="820" y1="240" x2="1080" y2="220"/>
    <line x1="820" y1="540" x2="1080" y2="540"/>
  </g>

  <!-- Central gateway hub (hexagon) -->
  <g transform="translate(950,380)">
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#0a0e1f" stroke="url(#orange)" stroke-width="4"/>
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="url(#orange)" opacity="0.18"/>
    <text x="0" y="-2" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#FF9900" text-anchor="middle" letter-spacing="1">AWS</text>
    <text x="0" y="18" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFB066" text-anchor="middle" letter-spacing="1.5">GATEWAY</text>
  </g>

  <!-- Surrounding agent nodes -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <g transform="translate(1080,220)">
      <circle r="32" fill="#0a0e1f" stroke="#7B5CFF" stroke-width="3"/>
      <circle r="20" fill="#7B5CFF" opacity="0.35"/>
      <text y="5" font-size="14" fill="#fff">A1</text>
    </g>
    <g transform="translate(1160,350)">
      <circle r="32" fill="#0a0e1f" stroke="#7B5CFF" stroke-width="3"/>
      <circle r="20" fill="#7B5CFF" opacity="0.35"/>
      <text y="5" font-size="14" fill="#fff">A2</text>
    </g>
    <g transform="translate(1080,540)">
      <circle r="32" fill="#0a0e1f" stroke="#7B5CFF" stroke-width="3"/>
      <circle r="20" fill="#7B5CFF" opacity="0.35"/>
      <text y="5" font-size="14" fill="#fff">A3</text>
    </g>
    <g transform="translate(820,240)">
      <circle r="28" fill="#0a0e1f" stroke="#7B5CFF" stroke-width="3"/>
      <circle r="17" fill="#7B5CFF" opacity="0.35"/>
      <text y="5" font-size="13" fill="#fff">A4</text>
    </g>
    <g transform="translate(820,540)">
      <circle r="28" fill="#0a0e1f" stroke="#7B5CFF" stroke-width="3"/>
      <circle r="17" fill="#7B5CFF" opacity="0.35"/>
      <text y="5" font-size="13" fill="#fff">A5</text>
    </g>
  </g>

  <!-- Claude Robot Character (left side) -->
  <g transform="translate(180,400)" filter="url(#shadow)">
    <!-- Antenna -->
    <line x1="0" y1="-150" x2="0" y2="-110" stroke="#B89AFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-155" r="9" fill="#FF9900"/>
    <circle cx="0" cy="-155" r="14" fill="#FF9900" opacity="0.3"/>
    
    <!-- Head -->
    <rect x="-85" y="-110" width="170" height="140" rx="28" fill="url(#robotBody)" stroke="#3a2570" stroke-width="3"/>
    <!-- Face screen -->
    <rect x="-65" y="-90" width="130" height="90" rx="18" fill="#0a0e1f"/>
    <!-- Eyes -->
    <circle cx="-28" cy="-50" r="13" fill="#FF9900"/>
    <circle cx="28" cy="-50" r="13" fill="#FF9900"/>
    <circle cx="-25" cy="-53" r="4" fill="#fff"/>
    <circle cx="31" cy="-53" r="4" fill="#fff"/>
    <!-- Smile -->
    <path d="M -25,-20 Q 0,-5 25,-20" stroke="#FF9900" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Ears -->
    <rect x="-100" y="-75" width="15" height="40" rx="6" fill="#6B4DCC" stroke="#3a2570" stroke-width="2"/>
    <rect x="85" y="-75" width="15" height="40" rx="6" fill="#6B4DCC" stroke="#3a2570" stroke-width="2"/>
    
    <!-- Body -->
    <rect x="-70" y="30" width="140" height="110" rx="20" fill="url(#robotBody)" stroke="#3a2570" stroke-width="3"/>
    <!-- Chest panel -->
    <rect x="-45" y="50" width="90" height="55" rx="10" fill="#0a0e1f"/>
    <circle cx="-20" cy="77" r="6" fill="#7B5CFF"/>
    <circle cx="0" cy="77" r="6" fill="#FF9900"/>
    <circle cx="20" cy="77" r="6" fill="#7B5CFF"/>
    
    <!-- Arms -->
    <rect x="-95" y="45" width="25" height="80" rx="12" fill="#6B4DCC" stroke="#3a2570" stroke-width="2"/>
    <rect x="70" y="45" width="25" height="80" rx="12" fill="#6B4DCC" stroke="#3a2570" stroke-width="2"/>
  </g>

  <!-- Orange accent bar behind title -->
  <rect x="380" y="78" width="14" height="120" fill="url(#orange)"/>

  <!-- Top label -->
  <text x="410" y="110" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="800" fill="#FF9900" letter-spacing="4">CLAUDE  •  AWS TUTORIAL</text>
  
  <text x="410" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#B89AFF" letter-spacing="2">Custom Skill Build</text>

  <!-- Main title -->
  <g font-family="Impact, Arial Black, sans-serif" font-weight="900">
    <text x="410" y="260" font-size="84" fill="#ffffff" letter-spacing="-2">AGENTCORE</text>
    <text x="410" y="345" font-size="84" fill="url(#orange)" letter-spacing="-2" stroke="#000" stroke-width="1">GATEWAY</text>
    <text x="410" y="430" font-size="56" fill="#ffffff" letter-spacing="-1">for BEDROCK</text>
    <text x="410" y="495" font-size="56" fill="url(#purple)" letter-spacing="-1">MULTI-AGENT</text>
    <text x="410" y="560" font-size="56" fill="url(#purple)" letter-spacing="-1">SYSTEMS</text>
  </g>

  <!-- Bottom tag line -->
  <rect x="410" y="600" width="540" height="50" rx="8" fill="#FF9900"/>
  <text x="430" y="635" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" fill="#0a0e1f" letter-spacing="2">BUILD A CUSTOM CLAUDE SKILL</text>

  <!-- Small AWS cloud icon corner -->
  <g transform="translate(1180,80)" opacity="0.9">
    <path d="M -40,10 Q -45,-10 -25,-15 Q -20,-30 0,-25 Q 15,-35 30,-20 Q 50,-18 45,5 Q 50,20 30,20 L -25,20 Q -45,22 -40,10 Z" fill="#FF9900" stroke="#0a0e1f" stroke-width="2"/>
  </g>
</svg>