<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a1530"/>
<stop offset="1" stop-color="#1a2a5e"/>
</linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ff8a1f"/>
<stop offset="1" stop-color="#ff5e0e"/>
</linearGradient>
<radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="0.4" stop-color="#5ef3ff"/>
<stop offset="1" stop-color="#0aa3c2"/>
</radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e8ecf5"/>
<stop offset="1" stop-color="#9aa3bd"/>
</linearGradient>
</defs>

<!-- Background -->
<rect width="1280" height="720" fill="url(#bg)"/>

<!-- Diagonal energy stripes -->
<polygon points="-100,720 400,0 560,0 60,720" fill="#ff7a1a" opacity="0.12"/>
<polygon points="100,720 600,0 680,0 180,720" fill="#ff7a1a" opacity="0.15"/>
<polygon points="900,-50 1380,-50 1380,80 900,80" fill="url(#orange)" opacity="0.25" transform="rotate(-8 1140 15)"/>

<!-- Code grid background hint -->
<g opacity="0.08" font-family="Consolas, monospace" font-size="14" fill="#7fd4ff">
<text x="40" y="60">{ skill: "qa" }</text>
<text x="40" y="680">$ claude --skill qa</text>
<text x="980" y="700">// automation</text>
</g>

<!-- Orange accent diagonal bar -->
<polygon points="0,560 720,560 660,640 0,640" fill="url(#orange)"/>
<text x="40" y="618" font-family="Impact, Arial Black, sans-serif" font-size="36" fill="#0a1530" letter-spacing="2">CUSTOM SKILL  •  AUTOMATION  •  AI</text>

<!-- Title -->
<g font-family="Impact, Arial Black, sans-serif" fill="#ffffff">
<text x="50" y="180" font-size="98" letter-spacing="-1" stroke="#0a1530" stroke-width="2">CLAUDE CODE</text>
<text x="50" y="290" font-size="120" fill="url(#orange)" letter-spacing="-2" stroke="#0a1530" stroke-width="2">Q&amp;A SKILL</text>
<text x="54" y="370" font-size="38" fill="#7fd4ff" letter-spacing="3" font-family="Helvetica Neue, Arial, sans-serif" font-weight="bold">BUILD • AUTOMATE • SHIP</text>
</g>

<!-- Code window decoration -->
<g transform="translate(50,400)">
<rect width="360" height="130" rx="10" fill="#0d1a3a" stroke="#2a3a6a" stroke-width="2"/>
<circle cx="20" cy="20" r="6" fill="#ff5f56"/>
<circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="20" r="6" fill="#27c93f"/>
<text x="20" y="60" font-family="Consolas, monospace" font-size="16" fill="#7fd4ff">&gt; claude skill create</text>
<text x="20" y="85" font-family="Consolas, monospace" font-size="16" fill="#ff8a1f">  --name "qa-bot"</text>
<text x="20" y="110" font-family="Consolas, monospace" font-size="16" fill="#9af59a">  ✔ ready</text>
</g>

<!-- ROBOT -->
<g transform="translate(820,150)">
<!-- Antenna -->
<line x1="170" y1="20" x2="170" y2="-30" stroke="#cdd5e8" stroke-width="6"/>
<circle cx="170" cy="-38" r="14" fill="url(#orange)"/>
<circle cx="170" cy="-38" r="14" fill="none" stroke="#ffd9a8" stroke-width="2" opacity="0.6"/>

<!-- Head -->
<rect x="50" y="20" width="240" height="190" rx="32" fill="url(#metal)" stroke="#2a3a6a" stroke-width="3"/>
<!-- Ear panels -->
<rect x="30" y="80" width="22" height="70" rx="6" fill="#7a849c"/>
<rect x="288" y="80" width="22" height="70" rx="6" fill="#7a849c"/>

<!-- Face plate -->
<rect x="75" y="55" width="190" height="120" rx="20" fill="#0a1530"/>

<!-- Eyes -->
<rect x="100" y="90" width="55" height="45" rx="10" fill="url(#eye)"/>
<rect x="185" y="90" width="55" height="45" rx="10" fill="url(#eye)"/>
<rect x="108" y="98" width="14" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
<rect x="193" y="98" width="14" height="10" rx="3" fill="#ffffff" opacity="0.9"/>

<!-- Mouth grille -->
<g stroke="#5ef3ff" stroke-width="3" stroke-linecap="round">
<line x1="130" y1="155" x2="145" y2="155"/>
<line x1="155" y1="155" x2="170" y2="155"/>
<line x1="180" y1="155" x2="195" y2="155"/>
<line x1="205" y1="155" x2="220" y2="155"/>
</g>

<!-- Neck -->
<rect x="150" y="210" width="40" height="20" fill="#7a849c"/>

<!-- Body -->
<rect x="50" y="230" width="240" height="190" rx="24" fill="url(#metal)" stroke="#2a3a6a" stroke-width="3"/>

<!-- Chest screen -->
<rect x="80" y="252" width="180" height="80" rx="8" fill="#0a1530"/>
<g font-family="Consolas, monospace" font-size="11" fill="#5ef3ff">
<text x="90" y="270">def answer(q):</text>
<text x="90" y="286" fill="#ff8a1f">  skill.run()</text>
<text x="90" y="302">  return ok</text>
<text x="90" y="320" fill="#9af59a">&gt;&gt; deployed</text>
</g>

<!-- AI Badge -->
<circle cx="170" cy="375" r="28" fill="url(#orange)" stroke="#ffffff" stroke-width="3"/>
<text x="170" y="385" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#ffffff" font-weight="900">AI</text>

<!-- Arms -->
<rect x="10" y="245" width="40" height="120" rx="18" fill="#9aa3bd" stroke="#2a3a6a" stroke-width="3"/>
<circle cx="30" cy="375" r="24" fill="url(#metal)" stroke="#2a3a6a" stroke-width="3"/>
<rect x="290" y="245" width="40" height="120" rx="18" fill="#9aa3bd" stroke="#2a3a6a" stroke-width="3"/>
<circle cx="310" cy="375" r="24" fill="url(#metal)" stroke="#2a3a6a" stroke-width="3"/>

<!-- Legs -->
<rect x="100" y="420" width="45" height="60" rx="10" fill="#7a849c" stroke="#2a3a6a" stroke-width="3"/>
<rect x="195" y="420" width="45" height="60" rx="10" fill="#7a849c" stroke="#2a3a6a" stroke-width="3"/>
<ellipse cx="122" cy="485" rx="35" ry="10" fill="#3a4566"/>
<ellipse cx="217" cy="485" rx="35" ry="10" fill="#3a4566"/>
</g>

<!-- Floating Q symbol -->
<g transform="translate(720,180)">
<circle cx="0" cy="0" r="50" fill="url(#orange)" stroke="#ffffff" stroke-width="4"/>
<text x="0" y="20" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="62" fill="#ffffff" font-weight="900">Q</text>
</g>
<g transform="translate(770,470)">
<circle cx="0" cy="0" r="38" fill="#5ef3ff" stroke="#ffffff" stroke-width="3"/>
<text x="0" y="14" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="44" fill="#0a1530" font-weight="900">A</text>
</g>

<!-- Footer / branding -->
<rect x="0" y="690" width="1280" height="30" fill="#050b1f"/>
<text x="40" y="710" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7fd4ff" font-weight="bold">HOMETASK AI</text>
<text x="180" y="710" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#cdd5e8">hometask.io</text>
<text x="320" y="710" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#cdd5e8">sales@hometask.io</text>
</svg>