<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1273"/>
      <stop offset="55%" stop-color="#5b1ea8"/>
      <stop offset="100%" stop-color="#2a0d5c"/>
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe14d" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffae1a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffae1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7ff0ff"/>
      <stop offset="100%" stop-color="#0aa7c4"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4eee2"/>
      <stop offset="100%" stop-color="#c9bfa8"/>
    </linearGradient>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="none"/>
      <rect width="2" height="40" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#stripes)"/>

  <!-- Burst behind robot -->
  <circle cx="980" cy="370" r="320" fill="url(#burst)"/>

  <!-- CLAUDE CODE pill (orange) -->
  <rect x="60" y="48" width="280" height="50" rx="25" fill="#ff7a1a"/>
  <text x="200" y="82" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="2">CLAUDE CODE</text>

  <!-- CUSTOM SKILL subtitle -->
  <text x="60" y="170" font-family="Impact, Arial Black, sans-serif" font-size="58" fill="#ffffff" letter-spacing="3">CUSTOM SKILL</text>

  <!-- Yellow skewed rect covering both lines -->
  <g transform="translate(40,210)">
    <rect x="0" y="0" width="920" height="230" fill="#ffe14d" transform="skewX(-10)"/>
  </g>

  <!-- Title lines -->
  <text x="70" y="305" font-family="Impact, Arial Black, sans-serif" font-size="86" fill="#2a0d5c" letter-spacing="2">CREATE AN AWS</text>
  <text x="70" y="400" font-family="Impact, Arial Black, sans-serif" font-size="86" fill="#2a0d5c" letter-spacing="2">COGNITO USER POOL</text>

  <!-- Terminal code lines bottom-left -->
  <g transform="translate(60,475)">
    <rect x="0" y="0" width="540" height="170" rx="10" fill="#0e0428" stroke="#ff7a1a" stroke-width="2"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="6" fill="#febc2e"/>
    <circle cx="60" cy="20" r="6" fill="#28c840"/>
    <text x="20" y="60" font-family="Menlo, Consolas, monospace" font-size="16" fill="#7ff0ff">$ claude skill add cognito-user-pool</text>
    <text x="20" y="86" font-family="Menlo, Consolas, monospace" font-size="16" fill="#b39dff">› aws cognito-idp create-user-pool \</text>
    <text x="20" y="112" font-family="Menlo, Consolas, monospace" font-size="16" fill="#ffe14d">    --pool-name HometaskUsers</text>
    <text x="20" y="138" font-family="Menlo, Consolas, monospace" font-size="16" fill="#28c840">✔ pool created · id: us-east-1_aBc12</text>
  </g>

  <!-- ROBOT -->
  <g transform="translate(820,180)">
    <!-- Antenna -->
    <line x1="160" y1="20" x2="160" y2="-20" stroke="#e6dcc4" stroke-width="6"/>
    <circle cx="160" cy="-28" r="12" fill="#ff7a1a"/>
    <circle cx="160" cy="-28" r="5" fill="#ffe14d"/>

    <!-- Ears -->
    <rect x="10" y="80" width="22" height="80" rx="6" fill="#8a7d63"/>
    <rect x="288" y="80" width="22" height="80" rx="6" fill="#8a7d63"/>

    <!-- Head -->
    <rect x="30" y="20" width="260" height="200" rx="34" fill="url(#bodyGrad)" stroke="#3a1273" stroke-width="4"/>

    <!-- Eyes -->
    <rect x="70" y="85" width="70" height="50" rx="10" fill="#0a0428"/>
    <rect x="180" y="85" width="70" height="50" rx="10" fill="#0a0428"/>
    <circle cx="105" cy="110" r="20" fill="url(#eyeGlow)"/>
    <circle cx="215" cy="110" r="20" fill="url(#eyeGlow)"/>

    <!-- Mouth grille -->
    <g stroke="#3a1273" stroke-width="4" stroke-linecap="round">
      <line x1="110" y1="175" x2="130" y2="175"/>
      <line x1="145" y1="175" x2="165" y2="175"/>
      <line x1="180" y1="175" x2="200" y2="175"/>
    </g>

    <!-- Neck -->
    <rect x="140" y="220" width="40" height="20" fill="#8a7d63"/>

    <!-- Body -->
    <rect x="50" y="240" width="220" height="170" rx="20" fill="url(#bodyGrad)" stroke="#3a1273" stroke-width="4"/>

    <!-- Chest screen -->
    <rect x="75" y="260" width="170" height="90" rx="8" fill="#0a0428"/>
    <line x1="85" y1="278" x2="180" y2="278" stroke="#7ff0ff" stroke-width="4"/>
    <line x1="85" y1="295" x2="220" y2="295" stroke="#ffe14d" stroke-width="4"/>
    <line x1="85" y1="312" x2="160" y2="312" stroke="#b39dff" stroke-width="4"/>
    <line x1="85" y1="329" x2="200" y2="329" stroke="#7ff0ff" stroke-width="4"/>

    <!-- AI badge -->
    <circle cx="160" cy="382" r="22" fill="#ff7a1a" stroke="#ffffff" stroke-width="3"/>
    <text x="160" y="390" font-family="Arial Black, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="900">AI</text>

    <!-- Arms -->
    <rect x="0" y="260" width="46" height="120" rx="20" fill="#c9bfa8" stroke="#3a1273" stroke-width="4"/>
    <circle cx="23" cy="390" r="22" fill="#e6dcc4" stroke="#3a1273" stroke-width="4"/>
    <rect x="274" y="260" width="46" height="120" rx="20" fill="#c9bfa8" stroke="#3a1273" stroke-width="4"/>
    <circle cx="297" cy="390" r="22" fill="#e6dcc4" stroke="#3a1273" stroke-width="4"/>

    <!-- Legs -->
    <rect x="85" y="410" width="44" height="60" rx="10" fill="#8a7d63" stroke="#3a1273" stroke-width="4"/>
    <rect x="191" y="410" width="44" height="60" rx="10" fill="#8a7d63" stroke="#3a1273" stroke-width="4"/>
    <rect x="75" y="460" width="64" height="18" rx="6" fill="#3a1273"/>
    <rect x="181" y="460" width="64" height="18" rx="6" fill="#3a1273"/>
  </g>

  <!-- Footer -->
  <rect x="0" y="672" width="1280" height="48" fill="#1a0640"/>
  <text x="24" y="704" font-family="Arial Black, sans-serif" font-size="20" fill="#ffe14d" font-weight="900">HOMETASK AI</text>
  <text x="560" y="703" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">https://hometask.io</text>
  <text x="1256" y="703" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="end">sales@hometask.io</text>
</svg>