<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1273"/>
      <stop offset="0.55" stop-color="#5b1ea8"/>
      <stop offset="1" stop-color="#2a0d5c"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe14d" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffb000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#5ef3ff"/>
      <stop offset="1" stop-color="#0aa7c4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Diagonal stripe accents -->
  <g opacity="0.07" fill="#ffe14d">
    <rect x="-200" y="-50" width="80" height="1000" transform="rotate(20 0 0)"/>
    <rect x="100" y="-50" width="40" height="1000" transform="rotate(20 0 0)"/>
    <rect x="400" y="-50" width="100" height="1000" transform="rotate(20 0 0)"/>
    <rect x="800" y="-50" width="50" height="1000" transform="rotate(20 0 0)"/>
  </g>

  <!-- Glow burst behind robot -->
  <circle cx="980" cy="360" r="340" fill="url(#burst)"/>

  <!-- Top-left orange tag -->
  <rect x="60" y="60" width="240" height="48" rx="24" fill="#ff6a00"/>
  <text x="180" y="93" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="2">CLAUDE CODE</text>

  <!-- Title -->
  <text x="60" y="200" font-family="Impact, Arial Black, sans-serif" font-size="62" fill="#ffffff" letter-spacing="1">CUSTOM SKILL</text>

  <!-- Single yellow skewed rect covering the two highlighted lines -->
  <g transform="translate(0,0)">
    <rect x="40" y="230" width="780" height="240" fill="#ffe14d" transform="skewX(-10)"/>
  </g>

  <!-- Highlighted title lines (no transform on text) -->
  <text x="65" y="320" font-family="Impact, Arial Black, sans-serif" font-size="92" fill="#2a0d5c" letter-spacing="1">AWS BEDROCK</text>
  <text x="65" y="420" font-family="Impact, Arial Black, sans-serif" font-size="92" fill="#2a0d5c" letter-spacing="1">PYTHON CLIENT</text>

  <!-- Subtitle below highlight -->
  <text x="60" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-weight="bold" font-size="28" fill="#ffe14d" letter-spacing="2">BUILD A CUSTOM AI CLIENT TUTORIAL</text>

  <!-- Terminal / code decoration bottom-left -->
  <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#c9b6ff" opacity="0.85">
    <text x="60" y="555">$ claude skill create bedrock-client</text>
    <text x="60" y="578">&gt; import boto3</text>
    <text x="60" y="601">&gt; client = boto3.client("bedrock-runtime")</text>
    <text x="60" y="624">&gt; response = client.invoke_model(...)</text>
  </g>

  <!-- ROBOT -->
  <g transform="translate(870,180)">
    <!-- Antenna -->
    <line x1="160" y1="0" x2="160" y2="-45" stroke="#ffe14d" stroke-width="5"/>
    <circle cx="160" cy="-52" r="11" fill="#ff6a00"/>
    <circle cx="160" cy="-52" r="4" fill="#ffe14d"/>

    <!-- Head -->
    <rect x="60" y="0" width="200" height="160" rx="28" fill="#d9d2ec" stroke="#2a0d5c" stroke-width="4"/>
    <!-- Ear panels -->
    <rect x="40" y="50" width="22" height="70" rx="6" fill="#a89cc9" stroke="#2a0d5c" stroke-width="3"/>
    <rect x="258" y="50" width="22" height="70" rx="6" fill="#a89cc9" stroke="#2a0d5c" stroke-width="3"/>

    <!-- Eyes -->
    <rect x="92" y="50" width="48" height="38" rx="8" fill="#0a1a2e"/>
    <rect x="180" y="50" width="48" height="38" rx="8" fill="#0a1a2e"/>
    <ellipse cx="116" cy="69" rx="18" ry="14" fill="url(#eye)"/>
    <ellipse cx="204" cy="69" rx="18" ry="14" fill="url(#eye)"/>
    <circle cx="121" cy="64" r="4" fill="#ffffff"/>
    <circle cx="209" cy="64" r="4" fill="#ffffff"/>

    <!-- Mouth grille -->
    <g stroke="#2a0d5c" stroke-width="4" stroke-linecap="round">
      <line x1="120" y1="120" x2="135" y2="120"/>
      <line x1="145" y1="120" x2="160" y2="120"/>
      <line x1="170" y1="120" x2="185" y2="120"/>
      <line x1="195" y1="120" x2="210" y2="120"/>
    </g>

    <!-- Neck -->
    <rect x="140" y="160" width="40" height="18" fill="#a89cc9" stroke="#2a0d5c" stroke-width="3"/>

    <!-- Body -->
    <rect x="40" y="178" width="240" height="160" rx="22" fill="#e9e2f8" stroke="#2a0d5c" stroke-width="4"/>

    <!-- Chest screen -->
    <rect x="70" y="200" width="120" height="80" rx="6" fill="#0a1a2e"/>
    <g font-family="Consolas, monospace" font-size="10" fill="#5ef3ff">
      <text x="78" y="218">&gt; bedrock.run()</text>
      <text x="78" y="234" fill="#ffe14d">claude-3.5</text>
      <text x="78" y="250" fill="#ffffff">ok 200</text>
      <text x="78" y="266" fill="#5ef3ff">skill: ready</text>
    </g>

    <!-- AI badge -->
    <circle cx="232" cy="240" r="32" fill="#ff6a00" stroke="#2a0d5c" stroke-width="4"/>
    <text x="232" y="251" font-family="Impact, Arial Black, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle">AI</text>

    <!-- Arms -->
    <rect x="0" y="195" width="40" height="100" rx="18" fill="#d9d2ec" stroke="#2a0d5c" stroke-width="4"/>
    <circle cx="20" cy="300" r="22" fill="#a89cc9" stroke="#2a0d5c" stroke-width="4"/>
    <rect x="280" y="195" width="40" height="100" rx="18" fill="#d9d2ec" stroke="#2a0d5c" stroke-width="4"/>
    <circle cx="300" cy="300" r="22" fill="#a89cc9" stroke="#2a0d5c" stroke-width="4"/>

    <!-- Legs -->
    <rect x="90" y="338" width="36" height="60" rx="10" fill="#a89cc9" stroke="#2a0d5c" stroke-width="4"/>
    <rect x="194" y="338" width="36" height="60" rx="10" fill="#a89cc9" stroke="#2a0d5c" stroke-width="4"/>
    <rect x="78" y="395" width="60" height="20" rx="8" fill="#2a0d5c"/>
    <rect x="182" y="395" width="60" height="20" rx="8" fill="#2a0d5c"/>
  </g>

  <!-- Footer -->
  <rect x="0" y="672" width="1280" height="48" fill="#1a0640"/>
  <text x="24" y="704" font-family="Helvetica Neue, Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffe14d">HOMETASK AI</text>
  <text x="540" y="704" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff">https://hometask.io</text>
  <text x="1256" y="704" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="end">sales@hometask.io</text>
</svg>