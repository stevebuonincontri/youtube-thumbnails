<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#E8623A"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#D8D2CC"/>
    </linearGradient>
    <linearGradient id="paperMerged" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5DCD2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF8A5C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF8A5C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  
  <!-- Subtle grid -->
  <g stroke="#2a1f18" stroke-width="1" opacity="0.5">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
  </g>

  <!-- Terminal window header -->
  <rect x="40" y="40" width="1200" height="44" rx="10" fill="#241a14"/>
  <circle cx="68" cy="62" r="7" fill="#FF5F56"/>
  <circle cx="92" cy="62" r="7" fill="#FFBD2E"/>
  <circle cx="116" cy="62" r="7" fill="#27C93F"/>
  <text x="640" y="68" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#7a6657">claude-code  ~  /skills/merge-pdf</text>

  <!-- Glow behind icons -->
  <ellipse cx="640" cy="320" rx="520" ry="200" fill="url(#glow)"/>

  <!-- Left PDF -->
  <g transform="translate(140,170)" filter="url(#shadow)">
    <path d="M0,0 L130,0 L180,50 L180,260 L0,260 Z" fill="url(#paper)"/>
    <path d="M130,0 L130,50 L180,50 Z" fill="#B8AEA4"/>
    <rect x="20" y="80" width="140" height="8" rx="2" fill="#C9BFB5"/>
    <rect x="20" y="100" width="120" height="8" rx="2" fill="#C9BFB5"/>
    <rect x="20" y="120" width="135" height="8" rx="2" fill="#C9BFB5"/>
    <rect x="20" y="140" width="100" height="8" rx="2" fill="#C9BFB5"/>
    <rect x="0" y="195" width="180" height="40" fill="#E8623A"/>
    <text x="90" y="223" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#FFFFFF" letter-spacing="2">PDF</text>
  </g>

  <!-- Right PDF -->
  <g transform="translate(340,170)" filter="url(#shadow)">
    <path d="M0,0 L130,0 L180,50 L180,260 L0,260 Z" fill="url(#paper)"/>
    <path d="M130,0 L130,50 L180,50 Z" fill="#B8AEA4"/>
    <rect x="20" y="80" width="140" height="8" rx="2" fill="#C9BFB5"/>
    <rect x="20" y="100" width="110" height="8" rx="2" fill="#C9BFB5"/>
    <rect x="20" y="120" width="130" height="8" rx="2" fill="#C9BFB5"/>
    <rect x="20" y="140" width="95" height="8" rx="2" fill="#C9BFB5"/>
    <rect x="0" y="195" width="180" height="40" fill="#E8623A"/>
    <text x="90" y="223" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#FFFFFF" letter-spacing="2">PDF</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(595,295)">
    <path d="M0,-18 L60,-18 L60,-40 L110,0 L60,40 L60,18 L0,18 Z" fill="url(#orange)"/>
  </g>

  <!-- Merged PDF (bigger) -->
  <g transform="translate(770,140)" filter="url(#shadow)">
    <path d="M0,0 L160,0 L220,60 L220,320 L0,320 Z" fill="url(#paperMerged)"/>
    <path d="M160,0 L160,60 L220,60 Z" fill="#A89E94"/>
    <rect x="24" y="95" width="170" height="9" rx="2" fill="#BFB5AB"/>
    <rect x="24" y="118" width="150" height="9" rx="2" fill="#BFB5AB"/>
    <rect x="24" y="141" width="165" height="9" rx="2" fill="#BFB5AB"/>
    <rect x="24" y="164" width="130" height="9" rx="2" fill="#BFB5AB"/>
    <rect x="24" y="187" width="155" height="9" rx="2" fill="#BFB5AB"/>
    <rect x="0" y="240" width="220" height="50" fill="#E8623A"/>
    <text x="110" y="275" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" fill="#FFFFFF" letter-spacing="3">MERGED</text>
    
    <!-- Star burst -->
    <g transform="translate(210,-10)">
      <circle r="32" fill="#FFB84D"/>
      <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="#1a1410"/>
    </g>
  </g>

  <!-- Title -->
  <text x="640" y="565" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="92" fill="#FFFFFF" letter-spacing="-1">CLAUDE CODE SKILL:</text>
  <text x="640" y="660" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="98" fill="url(#orange)" letter-spacing="-1">MERGE PDF FILES</text>

  <!-- Accent line -->
  <rect x="540" y="585" width="200" height="4" fill="#E8623A"/>
</svg>