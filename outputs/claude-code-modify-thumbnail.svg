<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1273"/>
      <stop offset="0.55" stop-color="#5b1ea8"/>
      <stop offset="1" stop-color="#2a0d5c"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe14d" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffae00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffe14d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6ffff"/>
      <stop offset="0.4" stop-color="#3ef0ff"/>
      <stop offset="1" stop-color="#0a7a8a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Diagonal stripes -->
  <g opacity="0.07" fill="#ffe14d">
    <rect x="-200" y="-50" width="60" height="1000" transform="rotate(20 0 0)"/>
    <rect x="100" y="-50" width="40" height="1000" transform="rotate(20 0 0)"/>
    <rect x="350" y="-50" width="60" height="1000" transform="rotate(20 0 0)"/>
    <rect x="650" y="-50" width="40" height="1000" transform="rotate(20 0 0)"/>
    <rect x="900" y="-50" width="60" height="1000" transform="rotate(20 0 0)"/>
  </g>

  <!-- Glowing burst behind robot -->
  <circle cx="990" cy="350" r="340" fill="url(#burst)"/>

  <!-- Orange tag -->
  <rect x="60" y="60" width="270" height="48" rx="6" fill="#ff6a00"/>
  <text x="195" y="94" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#ffffff" letter-spacing="2">CLAUDE CODE</text>

  <!-- Title lines -->
  <text x="60" y="190" font-family="Impact, Arial Black, sans-serif" font-size="78" fill="#ffffff" letter-spacing="1">CUSTOM SKILL</text>
  <text x="60" y="262" font-family="Impact, Arial Black, sans-serif" font-size="40" fill="#ffffff" letter-spacing="2" opacity="0.9">FOR MODIFYING A</text>

  <!-- Single skewed yellow rect covering 2 highlighted lines -->
  <g transform="translate(40,290)">
    <rect x="0" y="0" width="780" height="220" fill="#ffe14d" transform="skewX(-10)"/>
  </g>
  <text x="70" y="395" font-family="Impact, Arial Black, sans-serif" font-size="108" fill="#2a0d5c" letter-spacing="1">THUMBNAIL</text>
  <text x="70" y="485" font-family="Impact, Arial Black, sans-serif" font-size="60" fill="#2a0d5c" letter-spacing="2">TUTORIAL INSIDE</text>

  <!-- Terminal code lines -->
  <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#c9b3ff" opacity="0.85">
    <text x="60" y="555">$ claude --skill thumbnail-mod</text>
    <text x="60" y="578">&gt; loading skill definition...</text>
    <text x="60" y="601">&gt; editing svg layers   [ok]</text>
    <text x="60" y="624">&gt; rendering preview...  done</text>
  </g>

  <!-- ROBOT -->
  <g transform="translate(870,170)">
    <!-- Antenna -->
    <line x1="140" y1="-30" x2="140" y2="10" stroke="#cfc6ff" stroke-width="5"/>
    <circle cx="140" cy="-38" r="11" fill="#3ef0ff"/>
    <circle cx="140" cy="-38" r="5" fill="#e6ffff"/>

    <!-- Ears -->
    <rect x="0" y="60" width="22" height="80" rx="6" fill="#7a5fc7"/>
    <rect x="258" y="60" width="22" height="80" rx="6" fill="#7a5fc7"/>

    <!-- Head -->
    <rect x="20" y="10" width="240" height="180" rx="32" fill="#e9e3ff" stroke="#2a0d5c" stroke-width="4"/>
    <rect x="38" y="28" width="204" height="144" rx="22" fill="#1a0640"/>

    <!-- Eyes -->
    <circle cx="100" cy="95" r="28" fill="url(#eye)"/>
    <circle cx="180" cy="95" r="28" fill="url(#eye)"/>
    <circle cx="92" cy="87" r="8" fill="#ffffff"/>
    <circle cx="172" cy="87" r="8" fill="#ffffff"/>

    <!-- Mouth grille -->
    <g stroke="#3ef0ff" stroke-width="4" stroke-linecap="round">
      <line x1="100" y1="148" x2="115" y2="148"/>
      <line x1="125" y1="148" x2="140" y2="148"/>
      <line x1="150" y1="148" x2="165" y2="148"/>
      <line x1="175" y1="148" x2="190" y2="148"/>
    </g>

    <!-- Neck -->
    <rect x="120" y="190" width="40" height="20" fill="#7a5fc7"/>

    <!-- Body -->
    <rect x="40" y="210" width="200" height="170" rx="22" fill="#e9e3ff" stroke="#2a0d5c" stroke-width="4"/>

    <!-- Chest screen -->
    <rect x="60" y="232" width="120" height="80" rx="8" fill="#1a0640"/>
    <g font-family="Consolas, monospace" font-size="10" fill="#3ef0ff">
      <text x="68" y="250">&gt; skill.run()</text>
      <text x="68" y="264">  loading...</text>
      <text x="68" y="278">  parse svg</text>
      <text x="68" y="292">  modify ok</text>
      <text x="68" y="306">  saved.</text>
    </g>

    <!-- AI badge -->
    <circle cx="210" cy="272" r="28" fill="#ff6a00" stroke="#ffffff" stroke-width="3"/>
    <text x="210" y="281" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#ffffff" font-weight="900">AI</text>

    <!-- Body buttons -->
    <circle cx="80" cy="345" r="7" fill="#ff6a00"/>
    <circle cx="105" cy="345" r="7" fill="#3ef0ff"/>
    <circle cx="130" cy="345" r="7" fill="#ffe14d"/>

    <!-- Arms -->
    <rect x="-2" y="225" width="42" height="110" rx="18" fill="#cfc6ff" stroke="#2a0d5c" stroke-width="4"/>
    <circle cx="19" cy="345" r="22" fill="#e9e3ff" stroke="#2a0d5c" stroke-width="4"/>
    <rect x="240" y="225" width="42" height="110" rx="18" fill="#cfc6ff" stroke="#2a0d5c" stroke-width="4"/>
    <circle cx="261" cy="345" r="22" fill="#e9e3ff" stroke="#2a0d5c" stroke-width="4"/>

    <!-- Legs -->
    <rect x="80" y="380" width="40" height="60" rx="10" fill="#7a5fc7" stroke="#2a0d5c" stroke-width="4"/>
    <rect x="160" y="380" width="40" height="60" rx="10" fill="#7a5fc7" stroke="#2a0d5c" stroke-width="4"/>
    <rect x="68" y="430" width="64" height="20" rx="8" fill="#e9e3ff" stroke="#2a0d5c" stroke-width="4"/>
    <rect x="148" y="430" width="64" height="20" rx="8" fill="#e9e3ff" stroke="#2a0d5c" stroke-width="4"/>
  </g>

  <!-- Footer -->
  <rect x="0" y="672" width="1280" height="48" fill="#1a0640"/>
  <text x="24" y="703" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#ffe14d">HOMETASK AI</text>
  <text x="540" y="702" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff">https://hometask.io</text>
  <text x="1256" y="702" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#ffffff">sales@hometask.io</text>
</svg>