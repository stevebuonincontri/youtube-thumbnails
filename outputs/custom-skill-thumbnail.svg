<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B5E"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="miniBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1810"/>
      <stop offset="1" stop-color="#1a0d08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g stroke="#2a2f3a" stroke-width="1" opacity="0.5">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <!-- Glow orb behind preview -->
  <circle cx="980" cy="380" r="220" fill="#D97757" opacity="0.18" filter="url(#glow)"/>

  <!-- Code editor window left -->
  <g transform="translate(60, 70)">
    <rect width="540" height="280" rx="14" fill="#13161c" stroke="#2a2f3a" stroke-width="1.5"/>
    <rect width="540" height="36" rx="14" fill="#1c2028"/>
    <rect y="22" width="540" height="14" fill="#1c2028"/>
    <circle cx="20" cy="18" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
    <circle cx="64" cy="18" r="6" fill="#28C840"/>
    <text x="260" y="23" font-family="Menlo, Monaco, monospace" font-size="12" fill="#6b7280" text-anchor="middle">thumbnail.skill.md</text>

    <g font-family="Menlo, Monaco, monospace" font-size="15">
      <text x="22" y="76" fill="#4b5563">01</text>
      <text x="60" y="76" fill="#D97757">---</text>
      <text x="22" y="100" fill="#4b5563">02</text>
      <text x="60" y="100" fill="#9ca3af">name:</text>
      <text x="125" y="100" fill="#FF8B5E">thumbnail-designer</text>
      <text x="22" y="124" fill="#4b5563">03</text>
      <text x="60" y="124" fill="#9ca3af">description:</text>
      <text x="178" y="124" fill="#e5e7eb">Create</text>
      <text x="248" y="124" fill="#e5e7eb">YT</text>
      <text x="278" y="124" fill="#e5e7eb">thumbnails</text>
      <text x="22" y="148" fill="#4b5563">04</text>
      <text x="60" y="148" fill="#D97757">---</text>
      <text x="22" y="172" fill="#4b5563">05</text>
      <text x="22" y="196" fill="#4b5563">06</text>
      <text x="60" y="196" fill="#7dd3fc">function</text>
      <text x="142" y="196" fill="#fcd34d">render</text>
      <text x="200" y="196" fill="#e5e7eb">() {</text>
      <text x="22" y="220" fill="#4b5563">07</text>
      <text x="80" y="220" fill="#9ca3af">return</text>
      <text x="142" y="220" fill="#86efac">&lt;Bold/&gt;</text>
      <text x="22" y="244" fill="#4b5563">08</text>
      <text x="60" y="244" fill="#e5e7eb">}</text>
    </g>
    <!-- Cursor blink -->
    <rect x="118" y="232" width="2" height="16" fill="#FF8B5E"/>
  </g>

  <!-- Title -->
  <g font-family="Impact, Arial Black, sans-serif" font-weight="900">
    <text x="60" y="450" font-size="92" fill="#ffffff" letter-spacing="-2">CREATE A</text>
    <text x="60" y="540" font-size="92" fill="url(#orange)" letter-spacing="-2">THUMBNAIL</text>
    <text x="60" y="610" font-size="50" fill="#e5e7eb" letter-spacing="-1" font-family="Helvetica Neue, Arial Black, sans-serif">with a</text>
    <text x="218" y="610" font-size="50" fill="#FF8B5E" letter-spacing="-1" font-family="Helvetica Neue, Arial Black, sans-serif">CUSTOM SKILL</text>
  </g>

  <!-- Underline accent -->
  <rect x="60" y="625" width="640" height="5" fill="url(#orange)"/>

  <!-- Mini thumbnail preview (meta) -->
  <g transform="translate(770, 200)">
    <!-- shadow -->
    <rect x="8" y="12" width="450" height="256" rx="14" fill="#000" opacity="0.5"/>
    <!-- frame -->
    <rect width="450" height="256" rx="14" fill="url(#miniBg)" stroke="#D97757" stroke-width="3"/>

    <!-- Mini grid -->
    <g stroke="#3a2418" stroke-width="0.8" opacity="0.6">
      <path d="M0 64 H450 M0 128 H450 M0 192 H450"/>
      <path d="M90 0 V256 M180 0 V256 M270 0 V256 M360 0 V256"/>
    </g>

    <!-- Mini title -->
    <text x="24" y="90" font-family="Impact, Arial Black, sans-serif" font-size="36" fill="#ffffff" font-weight="900" letter-spacing="-1">MAKE</text>
    <text x="24" y="130" font-family="Impact, Arial Black, sans-serif" font-size="36" fill="url(#orange)" font-weight="900" letter-spacing="-1">EPIC</text>
    <text x="24" y="170" font-family="Impact, Arial Black, sans-serif" font-size="36" fill="#ffffff" font-weight="900" letter-spacing="-1">CLICKS</text>

    <!-- Mini accent bar -->
    <rect x="24" y="184" width="160" height="3" fill="#FF8B5E"/>

    <!-- Mini icon: spark/star drawn as polygon -->
    <polygon points="350,80 365,115 400,120 372,142 380,178 350,158 320,178 328,142 300,120 335,115" fill="url(#orange)"/>

    <!-- corner label -->
    <rect x="380" y="20" width="52" height="22" rx="4" fill="#D97757"/>
    <text x="406" y="36" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="900" fill="#13161c" text-anchor="middle">PREV</text>
  </g>

  <!-- Arrow from code to preview -->
  <g transform="translate(620, 210)">
    <path d="M0 0 Q 80 -20 140 0" stroke="#FF8B5E" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
    <polygon points="140,-7 154,0 140,7" fill="#FF8B5E"/>
  </g>

  <!-- Bottom tag -->
  <g transform="translate(770, 480)">
    <circle cx="14" cy="14" r="6" fill="#FF8B5E"/>
    <circle cx="14" cy="14" r="10" fill="none" stroke="#FF8B5E" stroke-width="1.5" opacity="0.5"/>
    <text x="34" y="20" font-family="Menlo, Monaco, monospace" font-size="18" fill="#9ca3af">claude code</text>
    <text x="180" y="20" font-family="Menlo, Monaco, monospace" font-size="18" fill="#FF8B5E">+ skills</text>
  </g>

  <!-- Top corner mark -->
  <g transform="translate(1140, 60)">
    <rect x="-60" y="-22" width="100" height="36" rx="18" fill="#D97757"/>
    <text x="-10" y="3" font-family="Helvetica Neue, Arial Black, sans-serif" font-weight="900" font-size="18" fill="#13161c" text-anchor="middle">TUTORIAL</text>
  </g>
</svg>